<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <style>
        :root { --sidebar-width: 250px; --topbar-height: 60px; --primary-bg: #2c3e50; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Top Panel */
        #topbar { height: var(--topbar-height); background: #fff; border-bottom: 1px solid #ddd; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100; }
        #user-name { font-weight: bold; font-size: 1.1rem; }
        .toggle-btn { cursor: pointer; font-size: 1.5rem; background: none; border: none; }

        /* Dashboard Layout */
        #wrapper { display: flex; flex: 1; position: relative; overflow: hidden; }

        /* Collapsible Sidebar (Drawer) */
        #sidebar { width: var(--sidebar-width); background: var(--primary-bg); color: white; transition: 0.3s; position: absolute; height: 100%; left: 0; z-index: 99; transform: translateX(0); }
        #sidebar.collapsed { transform: translateX(-100%); }
        #sidebar ul { list-style: none; padding: 20px 0; margin: 0; }
        #sidebar li { padding: 15px 25px; cursor: pointer; transition: 0.2s; }
        #sidebar li:hover { background: #34495e; }
        #sidebar li.active { background: #3498db; border-left: 4px solid #fff; }

        /* Main View Panel */
        #main-view { flex: 1; padding: 30px; background: #f4f7f6; transition: 0.3s; margin-left: var(--sidebar-width); }
        #main-view.expanded { margin-left: 0; }
        .content-section { display: none; }
        .content-section.active { display: block; }
    </style>
</head>
<body>

    <!-- Top Panel -->
    <div id="topbar">
        <button class="toggle-btn" onclick="toggleSidebar()">☰</button>
        <div id="user-name">Welcome, Admin User</div>
        <div></div> <!-- Spacer -->
    </div>

    <div id="wrapper">
        <!-- Side Panel (Drawer) -->
        <nav id="sidebar">
            <ul>
                <li onclick="showSection('view-racks', this)" class="active">View Racks</li>
                <li onclick="showSection('manage-users', this)">Manage Users</li>
                <li onclick="showSection('log-sessions', this)">Log Sessions</li>
            </ul>
        </nav>

        <!-- Right Panel (Main Content) -->
        <main id="main-view">
            <div id="view-racks" class="content-section active">
                <h1>View Racks</h1>
                <p>Default view: Monitoring all equipment racks...</p>
            </div>
            <div id="manage-users" class="content-section">
                <h1>Manage Users</h1>
                <p>User administration panel...</p>
            </div>
            <div id="log-sessions" class="content-section">
                <h1>Log Sessions</h1>
                <p>History of all active and past sessions...</p>
            </div>
        </main>
    </div>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
            document.getElementById('main-view').classList.toggle('expanded');
        }

        function showSection(sectionId, element) {
            // Remove active class from all menu items and content
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('#sidebar li').forEach(li => li.classList.remove('active'));
            
            // Activate selected
            document.getElementById(sectionId).classList.add('active');
            element.classList.add('active');
            
            // Auto-collapse sidebar on mobile/small screens (Optional)
            if (window.innerWidth < 768) toggleSidebar();
        }
    </script>
</body>
</html>
