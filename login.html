<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Dashboard - Smart BikeRack</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 100px; background: #f4f4f9; }
    .card { background: white; padding: 30px; border-radius: 12px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 320px; }
    h2 { color: #333; }
    .info { margin: 20px 0; color: #666; font-size: 15px; }
    button { padding: 12px 30px; font-size: 16px; cursor: pointer; border: none; border-radius: 6px; background: #ef4444; color: white; transition: 0.2s; }
    button:hover { background: #dc2626; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="card">
    <h2 id="message">User Dashboard</h2>
    <div id="userDetails" class="info">
      Loading session details...
    </div>
    <button class="hidden" id="logoutBtn">Logout</button>
  </div>

  <script type=module>
    const SUPABASE_URL = "https://lguyiavotyrxdlyhsvmz.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxndXlpYXZvdHlyeGRseWhzdm16Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkxNzQ0MjQsImV4cCI6MjA4NDc1MDQyNH0.f1hT0B68mv2lxVsQldk3ABx_0yBBUK2t1fcRHWGhmyM";
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const messageEl = document.getElementById("message");
    const userDetailsEl = document.getElementById("userDetails");
    const logoutBtn = document.getElementById("logoutBtn");
    // 1. Get Params from URL
    const params = new URLSearchParams(window.location.search);
    const device = params.get("device");
    const slot = params.get("slot");
    const userId = params.get("id");

    const userIdInt = Number(userId);
    const slotInt = Number(slot);

    const storedData = JSON.parse(localStorage.getItem("session_data"));
      if (!storedData || 
          storedData.currentDevice != device || 
          storedData.currentSlot != slot || 
          storedData.userId != userId) {
          
          alert("You don't have access to this profile.");
          if (storedData && storedData.currentDevice) {
            window.location.href = `login.html?device=${storedData.currentDevice}&slot=${storedData.currentSlot}&id=${storedData.userId}`;
          } else {
            window.location.href = "index.html";
          }
          throw new Error("Unauthorized access blocked"); 
      }




    let userName = "N/A";

    if (!device || !slot || !userId) {
      messageEl.textContent = "Invalid Session";
      userDetailsEl.textContent = "Missing required parameters.";
      logoutBtn.classList.add("hidden");
    } else {
      
      // --- NEW: Fetch User Name ---
      const { data: user, error: nameError } = await client
      .from("registration")
      .select("name")
      .eq("id", Number(userId))
      .maybeSingle();
    
      if (nameError) console.error("Error fetching name:", nameError.message);
      
      if (user && user.name) {
        userName = user.name; 
      }
      // --- UPDATED DISPLAY ---
      userDetailsEl.innerHTML = `
        <strong>Name:</strong> ${userName}<br>
        <strong>Device:</strong> ${device}<br>
        <strong>Slot:</strong> ${slot}<br>
        <strong>User ID:</strong> ${userId}
      `;
      logoutBtn.classList.remove("hidden");
    }

    logoutBtn.onclick = async () => {
    logoutBtn.disabled = true;
    messageEl.textContent = "Finalizing session...";

    const userIdInt = Number(userId);
    const slotInt = Number(slot);
    
      try {
          const { error } = await client
              .from("rack_sessions")
              .update({ status: 3, timeout: new Date().toISOString() }) 
              .eq("device_uuid", device)
              .eq("slot", slotInt) 
              .eq("user_id", userIdInt) 
              .eq("status", 1);
  
          if (error) throw error;
      } catch (err) {
          console.error("Logout Error:", err.message);
      } finally {
          localStorage.removeItem("session_data");
          setTimeout(() => {
              window.location.href = `index.html?device=${device}&slot=${slot}`;
          }, 1200);
        }
      };

  </script>
</body>
</html>
