<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BikeRack Slot Access</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body{font-family:Arial;text-align:center;margin-top:100px}
button{padding:12px 25px;margin:8px;font-size:16px}
.hidden{display:none}
.error{color:red}
.muted{color:#777}
</style>
</head>
<body>

<h2 id="message">Welcome to Smart BikeRack</h2>
<div id="info" class="muted"></div>

<!-- VISITOR -->
<div id="visitorActions">
  <button id="visitorLoginBtn">Admin Login</button>
</div>

<!-- SLOT -->
<div id="slotActions" class="hidden">
  <button id="loginBtn">Login</button>
  <div class="muted">Register to create account</div>
  <button id="registerBtn">Register</button>
</div>

<script>
/* ================= CONFIG ================= */
const SUPABASE_URL = "https://lguyiavotyrxdlyhsvmz.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxndXlpYXZvdHlyeGRseWhzdm16Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkxNzQ0MjQsImV4cCI6MjA4NDc1MDQyNH0.f1hT0B68mv2lxVsQldk3ABx_0yBBUK2t1fcRHWGhmyM";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const message = document.getElementById("message");
const info = document.getElementById("info");
const visitorActions = document.getElementById("visitorActions");
const slotActions = document.getElementById("slotActions");
const loginBtn = document.getElementById("loginBtn");

/* ================= LOAD ================= */
window.onload = async () => {

  const params = new URLSearchParams(window.location.search);
  const device = params.get("device");
  const slot = parseInt(params.get("slot"));

  /* visitor */
  if(!device || !slot){
    visitorActions.classList.remove("hidden");
    return;
  }

  /* slot mode */
  visitorActions.classList.add("hidden");
  slotActions.classList.remove("hidden");
  info.textContent = `Device: ${device} | Slot: ${slot}`;

  /* block if occupied */
  const { data: active } = await client
    .from("rack_sessions")
    .select("id")
    .eq("device_uuid", device)
    .eq("slot", slot)
    .eq("status", 1)
    .maybeSingle();

  if(active){
    message.textContent = "Slot currently occupied";
    message.classList.add("error");
    slotActions.classList.add("hidden");
    return;
  }

  /* ================= LOGIN ================= */
  loginBtn.onclick = async () => {

    loginBtn.disabled = true;
    message.textContent = "Scanning fingerprint...";

    const { data: row } = await client
      .from("rack_sessions")
      .insert([{
        device_uuid: device,
        slot: slot,
        status: 0,
        user_id: null
      }])
      .select()
      .single();

    const poll = setInterval(async () => {

      const { data } = await client
        .from("rack_sessions")
        .select("status,user_id")
        .eq("id", row.id)
        .single();

      /* success */
      if(data.status === 1){
        clearInterval(poll);
        message.textContent = "Login successful. Redirecting...";

        window.location.href =
          `login.html?device=${device}&slot=${slot}&id=${row.id}&uid=${data.user_id}`;
      }

      /* fail */
      if(data.status === 2){
        clearInterval(poll);
        message.textContent = "Fingerprint not recognized. Try again.";
        loginBtn.disabled = false;
      }

    }, 1500);
  };

  /* ================= REGISTER ================= */
  document.getElementById("registerBtn").onclick = () => {
    window.location.href =
      `register.html?device=${device}&slot=${slot}`;
  };
};
</script>

</body>
</html>
