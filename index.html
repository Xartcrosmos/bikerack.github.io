<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BikeRack Slot Access</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body{font-family:Arial;text-align:center;margin-top:100px}
button{padding:12px 25px;margin:8px;font-size:16px;cursor:pointer}
.hidden{display:none}
.error{color:red}
.muted{color:#777;font-size:14px}
</style>
</head>
<body>

<h2 id="message">Welcome to Smart BikeRack</h2>
<div id="info" class="muted"></div>

<div id="slotActions" class="hidden">
  <button id="registerBtn">Register</button>
  <button id="loginUserBtn">Login</button>
  <button id="releaseBtn">Release Slot</button>
</div>

<script>
/* ========= CONFIG ========= */
const SUPABASE_URL = "https://lguyiavotyrxdlyhsvmz.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxndXlpYXZvdHlyeGRseWhzdm16Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkxNzQ0MjQsImV4cCI6MjA4NDc1MDQyNH0.f1hT0B68mv2lxVsQldk3ABx_0yBBUK2t1fcRHWGhmyM";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ========= ELEMENTS ========= */
const messageEl = document.getElementById("message");
const infoEl = document.getElementById("info");
const slotActions = document.getElementById("slotActions");
const releaseBtn = document.getElementById("releaseBtn");
const registerBtn = document.getElementById("registerBtn");
const loginUserBtn = document.getElementById("loginUserBtn");

let heartbeat = null;
let loginPollTimer = null;
let sessionId = null;
let sessionKey = null;
let currentDevice = null;
let currentSlot = null;

const now = () => Math.floor(Date.now()/1000);
const showError = (m)=>{messageEl.textContent=m;messageEl.className="error";};
const stopHeartbeat = ()=>{ if(heartbeat) clearInterval(heartbeat); };

/* ========= HEARTBEAT LOGIC ========= */
const runHeartbeat = async () => {
  if(!sessionId) return;
  const { error } = await client
    .from("sessions")
    .update({ last_seen: now() })
    .eq("session_id", sessionId);
  
  if (error) console.error("Heartbeat Failed:", error.message);
  else console.log("Heartbeat Sync: " + new Date().toLocaleTimeString());
};

const startHeartbeat = () => {
  stopHeartbeat();
  runHeartbeat(); 
  heartbeat = setInterval(runHeartbeat, 15000);
};

/* ========= INITIAL LOAD & LOCK ========= */
window.addEventListener("load", async ()=>{
  const params = new URLSearchParams(location.search);
  currentDevice = params.get("device");
  currentSlot = parseInt(params.get("slot"), 10);

  if(!currentDevice || Number.isNaN(currentSlot)){
    showError("Invalid QR.");
    return;
  }

  infoEl.textContent = `Device: ${currentDevice} | Slot: ${currentSlot}`;

  // Check physical occupancy
  const { data: rack } = await client
    .from("rack_sessions")
    .select("status")
    .eq("device_uuid", currentDevice)
    .eq("slot", currentSlot)
    .eq("status", 1)
    .maybeSingle();

  if (rack) {
    showError("Slot is physically occupied.");
    return;
  }

  // Session Lock Logic
  sessionKey = `session_${currentDevice}_${currentSlot}`;
  sessionId = localStorage.getItem(sessionKey) || crypto.randomUUID();

  const { data: active } = await client
    .from("sessions")
    .select("session_id")
    .eq("device_uuid", currentDevice)
    .eq("slot", currentSlot)
    .gt("last_seen", now() - 60)
    .maybeSingle();

  if (active && active.session_id !== sessionId) {
    showError("Slot is in use by another user.");
    return;
  }

  const { error: upsertErr } = await client
    .from("sessions")
    .upsert([{ 
      device_uuid: currentDevice, 
      slot: currentSlot, 
      session_id: sessionId, 
      last_seen: now() 
    }], { onConflict: 'device_uuid, slot' });

  if (upsertErr) {
    showError("Could not start session.");
    return;
  }

  localStorage.setItem(sessionKey, sessionId);
  messageEl.textContent = `Rack Ready - Slot ${currentSlot}`;
  slotActions.classList.remove("hidden");
  startHeartbeat();
});

/* ========= LOGIN / FINGERPRINT LOGIC ========= */
loginUserBtn.onclick = () => startLoginFlow(currentDevice, currentSlot);
registerBtn.onclick = () => { messageEl.textContent = "Registration flow not implemented yet."; };

async function startLoginFlow(device, slot){
  messageEl.textContent = "Please scan fingerprint to login...";
  
  const { data, error } = await client
    .from("rack_sessions")
    .insert([{
      device_uuid: device,
      slot: slot,
      user_id: null,
      timein: null,
      timeout: null,
      status: 0
    }])
    .select()
    .single();

  if(error){
    showError(error.message);
    return;
  }

  pollLogin(data.id, device, slot);
}

async function pollLogin(id, device, slot){
  const { data } = await client
    .from("rack_sessions")
    .select("status, user_id")
    .eq("id", id)
    .single();

  if(!data) return;

  if(data.status === 0){
    loginPollTimer = setTimeout(() => pollLogin(id, device, slot), 2000);
    return;
  }

  if(data.status === 1){
    clearTimeout(loginPollTimer);
    window.location.href = `login.html?device=${device}&slot=${slot}&id=${data.user_id}`;
    return;
  }

  if(data.status === 2){
    clearTimeout(loginPollTimer);
    alert("Fingerprint not recognized. Please try again.");
    await client.from("rack_sessions").update({ status: 0 }).eq("id", id);
    pollLogin(id, device, slot);
    return;
  }

  if(data.status === 3){
    clearTimeout(loginPollTimer);
    messageEl.textContent = "Session ended.";
  }
}

/* ========= RELEASE ========= */
releaseBtn.onclick = async ()=>{
  stopHeartbeat();
  clearTimeout(loginPollTimer);

  await client
    .from("sessions")
    .delete()
    .eq("session_id", sessionId);

  localStorage.removeItem(sessionKey);
  sessionId = null; // Prevent heartbeat resume
  messageEl.textContent = "Slot Released ✔";
  slotActions.classList.add("hidden");
};

/* ========= CLEANUP & RESUME ========= */
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    stopHeartbeat();
  } else if (sessionId && !slotActions.classList.contains("hidden")) {
    startHeartbeat();
  }
});

</script>
</body>
</html>
