<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BikeRack Slot Access</title>

  <!-- Supabase -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 100px;
    }

    button {
      padding: 12px 25px;
      margin: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .hidden { display: none; }
    .error { color: red; }
    .muted { color: #777; font-size: 14px; }
    .link {
      color: #2563eb;
      cursor: pointer;
      text-decoration: underline;
      font-size: 14px;
    }

    /* ===== Modal ===== */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    /* IMPORTANT: ensure hidden overrides modal display */
    .modal.hidden {
      display: none;
    }

    .modal-box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 300px;
    }

    .modal-box input {
      width: 90%;
      padding: 8px;
      margin: 6px 0;
    }
  </style>
</head>
<body>

  <h2 id="message">Welcome to Smart BikeRack</h2>
  <div id="info" class="muted"></div>

  <!-- Visitor (no QR scanned) -->
  <div id="visitorActions">
    <button type="button" id="visitorLoginBtn">Admin Login</button>
    <div class="muted">
      You don't have an account?
      <span id="claimLink" class="link">Claim your BikeRack unit now.</span>
    </div>
  </div>

  <!-- Slot user (QR scanned) -->
  <div id="slotActions" class="hidden">
    <button id="registerBtn">Register</button>
  </div>


  <!-- ============================ -->
  <!-- 🔹 Claim Device Modal -->
  <!-- ============================ -->
  <div id="claimModal" class="modal hidden">
    <div class="modal-box">
      <h3>Claim Device</h3>
      <input id="uuidInput" placeholder="Device UUID" />
      <input id="otcInput" placeholder="OTC Code" />
      <br>
      <button type="button" id="claimBtn">Next</button>
      <button onclick="closeModal('claimModal')">Cancel</button>
    </div>
  </div>


  <!-- ============================ -->
  <!-- 🔹 Create Admin Modal -->
  <!-- ============================ -->
  <div id="createModal" class="modal hidden">
    <div class="modal-box">
      <h3>Create Admin Account</h3>
      <input id="emailInput" placeholder="Gmail" />
      <input id="passInput" type="password" placeholder="Password" />
      <br>
      <button type="button" id="createBtn">Register</button>
      <button onclick="closeModal('createModal')">Cancel</button>
    </div>
  </div>


  <!-- ============================ -->
  <!-- 🔹 Login Modal -->
  <!-- ============================ -->
  <div id="loginModal" class="modal hidden">
    <div class="modal-box">
      <h3>Admin Login</h3>
      <input id="loginEmail" placeholder="Gmail" />
      <input id="loginPass" type="password" placeholder="Password" />
      <br>
      <button type="button" id="loginBtn">Login</button>
      <button onclick="closeModal('loginModal')">Cancel</button>
    </div>
  </div>


  <script>
    const SUPABASE_URL = "https://lguyiavotyrxdlyhsvmz.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxndXlpYXZvdHlyeGRseWhzdm16Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkxNzQ0MjQsImV4cCI6MjA4NDc1MDQyNH0.f1hT0B68mv2lxVsQldk3ABx_0yBBUK2t1fcRHWGhmyM";

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const messageEl = document.getElementById("message");
    const infoEl = document.getElementById("info");

    const visitorActions = document.getElementById("visitorActions");
    const slotActions = document.getElementById("slotActions");


    /* ============================
       Modal helpers
    ============================ */
    function openModal(id) {
      document.getElementById(id).classList.remove("hidden");
    }

    function closeModal(id) {
      document.getElementById(id).classList.add("hidden");
    }


    // Wait until DOM is fully ready before attaching events
document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("visitorLoginBtn").addEventListener("click", () => openModal("loginModal"));
  document.getElementById("claimLink").addEventListener("click", () => openModal("claimModal"));
});

window.onload = async () => {

      const params = new URLSearchParams(window.location.search);
      const device = params.get("device");
      const slot = parseInt(params.get("slot"));


      /* ============================
         Visitor mode (ADMIN SIDE)
      ============================ */
      if (!device || !slot) {
        messageEl.textContent = "Welcome! Please scan a QR code at the rack to register or use a slot.";
        visitorActions.classList.remove("hidden");

        return;
      }


      /* ============================
         Slot user mode
      ============================ */
      visitorActions.classList.add("hidden");
      infoEl.textContent = `Device: ${device} | Slot: ${slot}`;

      let sessionId = localStorage.getItem("session_id");
      if (!sessionId) {
        sessionId = crypto.randomUUID();
        localStorage.setItem("session_id", sessionId);
      }

      try {
        const { data: allowed, error } = await client.rpc("try_acquire_lock", {
          target_device: device,
          target_slot: slot,
          new_session_id: sessionId,
          timeout_seconds: 60
        });

        if (error) throw error;

        if (!allowed) {
          messageEl.textContent = "Slot currently in use. Try again later.";
          messageEl.classList.add("error");
          return;
        }

        messageEl.textContent = `Rack Ready — Slot ${slot}`;
        slotActions.classList.remove("hidden");

        setInterval(async () => {
          await client.from("sessions").insert([{
            device_uuid: device,
            slot: slot,
            session_id: sessionId,
            last_seen: Math.floor(Date.now() / 1000)
          }]);
        }, 15000);

      } catch (err) {
        console.error(err);
        messageEl.textContent = "Connection error.";
        messageEl.classList.add("error");
      }

      document.getElementById("registerBtn").onclick = () => {
        window.location.href = `register.html?device=${device}&slot=${slot}`;
      };
    };


    /* ============================
       Claim device logic
    ============================ */
    document.getElementById("claimBtn").onclick = async () => {

      const uuid = document.getElementById("uuidInput").value.trim();
      const otc = document.getElementById("otcInput").value.trim();

      if (!uuid || !otc) {
        alert("Please enter both UUID and OTC.");
        return;
      }

      try {
        const { data, error } = await client
          .from("device_unit")
          .select("*")
          .eq("uuid", uuid)
          .eq("otc", otc)
          .maybeSingle();

        if (error) throw error;

        if (!data) {
          alert("Device not found. Please check UUID/OTC.");
          return;
        }

        if (data.status === "claimed") {
          alert("This device is already claimed.");
          return;
        }

        closeModal("claimModal");
        openModal("createModal");
        window._claimUUID = uuid;

      } catch (err) {
        console.error(err);
        alert("Unable to verify device. Please try again.");
      }
    };


    /* ============================
       Create admin account
    ============================ */
    document.getElementById("createBtn").onclick = async () => {

      const email = document.getElementById("emailInput").value.trim();
      const password = document.getElementById("passInput").value.trim();

      if (!email || !password) {
        alert("Please enter email and password.");
        return;
      }

      try {
        const { error } = await client.auth.signUp({ email, password });
        if (error) {
          alert(error.message);
          return;
        }

        await client.from("admins").insert([{ email }]);

        await client
          .from("device_unit")
          .update({ status: "claimed" })
          .eq("uuid", window._claimUUID);

        alert("Account created successfully!");
        closeModal("createModal");

      } catch (err) {
        console.error(err);
        alert("Registration failed. Please try again.");
      }
    };


    /* ============================
       Admin login
    ============================ */
    document.getElementById("loginBtn").onclick = async () => {

      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPass").value.trim();

      if (!email || !password) {
        alert("Please enter email and password.");
        return;
      }

      try {
        // Step 1: authenticate
        const { error } = await client.auth.signInWithPassword({ email, password });

        if (error) {
          alert("Account does not exist or password is incorrect.");
          return;
        }

        // Step 2: check admin permission
        const { data: adminRow, error: adminErr } = await client
          .from("admins")
          .select("*")
          .eq("email", email)
          .maybeSingle();

        if (adminErr) throw adminErr;

        if (!adminRow) {
          await client.auth.signOut();
          alert("Account does not exist.");
          return;
        }

        // success
        window.location.href = "admin.html";

      } catch (err) {
        console.error(err);
        alert("Login failed. Please check your connection.");
      }
    };

  </script>

</body>
</html>
