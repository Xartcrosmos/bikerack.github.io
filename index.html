<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BikeRack Slot Access</title>

  <!-- Supabase -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 100px;
    }

    button {
      padding: 12px 25px;
      margin: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .hidden { display: none; }
    .error { color: red; }
    .muted { color: #777; font-size: 14px; }
  </style>
</head>
<body>

  <h2 id="message">Validating slot...</h2>
  <div id="info" class="muted"></div>

  <div id="actions" class="hidden">
    <button id="registerBtn">Register</button>
    <button id="loginBtn">Admin Login</button>
  </div>

  <script>
    /* =========================
       🔧 CONFIG
       Replace with your project keys
    ========================= */
    const SUPABASE_URL = "https://lguyiavotyrxdlyhsvmz.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxndXlpYXZvdHlyeGRseWhzdm16Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkxNzQ0MjQsImV4cCI6MjA4NDc1MDQyNH0.f1hT0B68mv2lxVsQldk3ABx_0yBBUK2t1fcRHWGhmyM";

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const messageEl = document.getElementById("message");
    const infoEl = document.getElementById("info");
    const actionsEl = document.getElementById("actions");

    window.onload = async () => {

      /* =========================
         1️⃣ Read device + slot
      ========================= */
      const params = new URLSearchParams(window.location.search);
      const device = params.get("device");
      const slot = parseInt(params.get("slot"));

      if (!device || !slot) {
        messageEl.textContent = "Invalid QR Code";
        messageEl.classList.add("error");
        return;
      }

      infoEl.textContent = `Device: ${device} | Slot: ${slot}`;


      /* =========================
         2️⃣ Create session id
      ========================= */
      let sessionId = localStorage.getItem("session_id");

      if (!sessionId) {
        sessionId = crypto.randomUUID();
        localStorage.setItem("session_id", sessionId);
      }


      /* =========================
         3️⃣ Try acquire lock
         calls Postgres function
      ========================= */
      try {
        const { data: allowed, error } = await client.rpc("try_acquire_lock", {
          target_device: device,
          target_slot: slot,
          new_session_id: sessionId,
          timeout_seconds: 60
        });

        if (error) throw error;

        if (!allowed) {
          messageEl.textContent = "Slot currently in use. Try again later.";
          messageEl.classList.add("error");
          return;
        }


        /* =========================
           4️⃣ Show actions
        ========================= */
        messageEl.textContent = `Rack Ready — Slot ${slot}`;
        actionsEl.classList.remove("hidden");


        /* =========================
           5️⃣ Heartbeat (INSERT only)
           keeps session alive
        ========================= */
        setInterval(async () => {
          await client.from("sessions").insert([{
            device_uuid: device,
            slot: slot,
            session_id: sessionId,
            last_seen: Math.floor(Date.now() / 1000)
          }]);
        }, 15000);

      } catch (err) {
        console.error(err);
        messageEl.textContent = "Connection error.";
        messageEl.classList.add("error");
      }


      /* =========================
         Buttons
      ========================= */
      document.getElementById("registerBtn").onclick = () => {
        window.location.href = `registration.html?device=${device}&slot=${slot}`;
      };

      document.getElementById("loginBtn").onclick = () => {
        window.location.href = `login_dashboard.html`;
      };
    };
  </script>

</body>
</html>
