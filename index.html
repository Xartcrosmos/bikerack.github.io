<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BikeRack Slot Access</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body{font-family:Arial;text-align:center;margin-top:100px}
button{padding:12px 25px;margin:8px;font-size:16px;cursor:pointer}
.hidden{display:none}
.error{color:red}
.muted{color:#777;font-size:14px}
</style>
</head>
<body>

<h2 id="message">Welcome to Smart BikeRack</h2>
<div id="info" class="muted"></div>

<div id="visitorActions">
  <button id="visitorLoginBtn">Admin Login</button>
</div>

<div id="slotActions" class="hidden">
  <button id="registerBtn">Register</button>
  <button id="loginUserBtn">Login</button>
</div>

<script>
/* ================= CONFIG ================= */

const SUPABASE_URL = "https://lguyiavotyrxdlyhsvmz.supabase.co";
const SUPABASE_ANON_KEY = "YOUR_ANON_KEY";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const messageEl = document.getElementById("message");
const infoEl = document.getElementById("info");
const visitorActions = document.getElementById("visitorActions");
const slotActions = document.getElementById("slotActions");

const registerBtn = document.getElementById("registerBtn");
const loginUserBtn = document.getElementById("loginUserBtn");

const now = () => Math.floor(Date.now()/1000);

/* ===================================================== */

window.addEventListener("load", async ()=>{

  const params = new URLSearchParams(window.location.search);
  const device = params.get("device");
  const slot   = parseInt(params.get("slot"));

  if(!device || !slot){
    messageEl.textContent = "Welcome! Please scan a QR code to use a slot.";
    return;
  }

  visitorActions.classList.add("hidden");
  infoEl.textContent = `Device: ${device} | Slot: ${slot}`;

  /* ========= OCCUPIED CHECK ========= */
  const { data: occupied } = await client
    .from("rack_sessions")
    .select("id")
    .eq("device_uuid", device)
    .eq("slot", slot)
    .eq("status", 1)
    .limit(1);

  if(occupied && occupied.length){
    messageEl.textContent = "Slot is occupied.";
    messageEl.classList.add("error");
    return;
  }

  /* =====================================================
     ✅ NEW SESSION LOGIC (REPLACES RPC LOCK)
  ===================================================== */

  const sessionKey = `session_${device}_${slot}`;
  let sessionId = localStorage.getItem(sessionKey);

  /* check active session */
  const { data: active } = await client
    .from("sessions")
    .select("session_id,last_seen")
    .eq("device_uuid", device)
    .eq("slot", slot)
    .gt("last_seen", now()-60)
    .limit(1);

  if(active && active.length){
    if(active[0].session_id !== sessionId){
      messageEl.textContent="Slot currently in use.";
      messageEl.classList.add("error");
      return;
    }
  }
  else{
    /* delete expired */
    await client
      .from("sessions")
      .delete()
      .eq("device_uuid", device)
      .eq("slot", slot);

    /* create new */
    sessionId = crypto.randomUUID();

    await client.from("sessions").insert([{
      device_uuid: device,
      slot,
      session_id: sessionId,
      last_seen: now()
    }]);

    localStorage.setItem(sessionKey, sessionId);
  }

  /* ========= ALLOW ========= */
  messageEl.textContent=`Rack Ready - Slot ${slot}`;
  slotActions.classList.remove("hidden");

  /* ========= HEARTBEAT ========= */
  setInterval(()=>{
    client
      .from("sessions")
      .update({ last_seen: now() })
      .eq("session_id", sessionId);
  },15000);

  /* ========= BUTTONS ========= */
  registerBtn.onclick=()=>{
    window.location.href=`register.html?device=${device}&slot=${slot}`;
  };

  loginUserBtn.onclick=()=>startLogin(device,slot);
});


/* =====================================================
   LOGIN FEATURE (UNCHANGED)
===================================================== */

let loginPollTimer=null;

async function startLogin(device,slot){

  messageEl.textContent="Please scan fingerprint to login...";

  const {data,error}=await client
    .from("rack_sessions")
    .insert([{
      device_uuid:device,
      slot,
      user_id:null,
      timein:null,
      timeout:null,
      status:0
    }])
    .select()
    .single();

  if(error){
    messageEl.textContent=error.message;
    return;
  }

  pollLogin(data.id,device,slot);
}


async function pollLogin(id,device,slot){

  const {data}=await client
    .from("rack_sessions")
    .select("status,user_id")
    .eq("id",id)
    .single();

  if(data.status===0){
    loginPollTimer=setTimeout(()=>pollLogin(id,device,slot),2000);
    return;
  }

  if(data.status===1){
    clearTimeout(loginPollTimer);
    window.location.href=`login.html?device=${device}&slot=${slot}&id=${data.user_id}`;
    return;
  }

  if(data.status===2){
    clearTimeout(loginPollTimer);

    alert("Fingerprint not recognized. Please try again.");

    await client
      .from("rack_sessions")
      .update({ status:0 })
      .eq("id",id);

    pollLogin(id,device,slot);
    return;
  }

  if(data.status===3){
    clearTimeout(loginPollTimer);
    messageEl.textContent="Session ended.";
  }
}
</script>

</body>
</html>
