<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BikeRack Slot Access</title>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    body{font-family:Arial;text-align:center;margin-top:100px}
    button{padding:12px 25px;margin:8px;font-size:16px;cursor:pointer}
    .hidden{display:none}
    .error{color:red}
    .muted{color:#777;font-size:14px}
  </style>
</head>
<body>

<h2 id="message">Welcome to Smart BikeRack</h2>
<div id="info" class="muted"></div>

<div id="slotActions" class="hidden">
  <button id="registerBtn">Register</button>
  <button id="loginUserBtn">Login</button>
</div>

<script>
/* ================= CONFIG ================= */

const SUPABASE_URL = "https://lguyiavotyrxdlyhsvmz.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxndXlpYXZvdHlyeGRseWhzdm16Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkxNzQ0MjQsImV4cCI6MjA4NDc1MDQyNH0.f1hT0B68mv2lxVsQldk3ABx_0yBBUK2t1fcRHWGhmyM";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const messageEl = document.getElementById("message");
const infoEl = document.getElementById("info");
const slotActions = document.getElementById("slotActions");
const registerBtn = document.getElementById("registerBtn");
const loginUserBtn = document.getElementById("loginUserBtn");


/* =====================================================
   SLOT MODE — FIXED (ONLY session reuse changed)
===================================================== */

window.addEventListener("load", async ()=>{

  const params = new URLSearchParams(location.search);
  const device = params.get("device");
  const slot   = parseInt(params.get("slot"),10);

  if(!device || !slot){
    messageEl.textContent="Scan QR first.";
    return;
  }

  infoEl.textContent=`Device: ${device} | Slot: ${slot}`;

  /* =================================================
     ✅ ALWAYS REUSE SAME SESSION (THIS IS THE ONLY FIX)
  ================================================= */

  const key = `session_${device}_${slot}`;
  let sessionId = localStorage.getItem(key);

  if(!sessionId){
    sessionId = crypto.randomUUID();
    localStorage.setItem(key, sessionId);

    await client.from("sessions").insert([{
      device_uuid: device,
      slot,
      session_id: sessionId,
      last_seen: Math.floor(Date.now()/1000)
    }]);
  }

  /* =================================================
     LOCK USING SAME SESSION ID (NOT tempSession)
  ================================================= */

  const { data: allowed } = await client.rpc("try_acquire_lock", {
    target_device: device,
    target_slot: slot,
    new_session_id: sessionId,
    timeout_seconds: 60
  });

  if(!allowed){
    messageEl.textContent="Slot is occupied.";
    messageEl.classList.add("error");
    return;
  }

  /* ================================================= */

  messageEl.textContent=`Rack Ready - Slot ${slot}`;
  slotActions.classList.remove("hidden");

  /* heartbeat (update only) */
  setInterval(async()=>{
    await client
      .from("sessions")
      .update({
        last_seen: Math.floor(Date.now()/1000)
      })
      .eq("session_id", sessionId);
  },15000);

  registerBtn.onclick=()=>{
    location.href=`register.html?device=${device}&slot=${slot}`;
  };

  loginUserBtn.onclick=()=>startLogin(device,slot);
});


/* =====================================================
   LOGIN (UNCHANGED — your original code kept)
===================================================== */

let loginPollTimer=null;

async function startLogin(device,slot){

  messageEl.textContent="Please scan fingerprint to login...";

  const {data,error}=await client
    .from("rack_sessions")
    .insert([{
      device_uuid:device,
      slot,
      user_id:null,
      timein:null,
      timeout:null,
      status:0
    }])
    .select()
    .single();

  if(error){
    messageEl.textContent=error.message;
    return;
  }

  pollLogin(data.id,device,slot);
}

async function pollLogin(id,device,slot){

  const {data}=await client
    .from("rack_sessions")
    .select("status,user_id")
    .eq("id",id)
    .single();

  if(data.status===0){
    loginPollTimer=setTimeout(()=>pollLogin(id,device,slot),2000);
    return;
  }

  if(data.status===1){
    clearTimeout(loginPollTimer);
    location.href=`login.html?device=${device}&slot=${slot}&id=${data.user_id}`;
  }
}
</script>

</body>
</html>
