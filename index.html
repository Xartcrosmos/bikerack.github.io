<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BikeRack Slot Access</title>

 <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body{font-family:Arial;text-align:center;margin-top:100px}
button{padding:12px 25px;margin:8px;font-size:16px;cursor:pointer}
.hidden{display:none}
.error{color:red}
.muted{color:#777;font-size:14px}
</style>
</head>
<body>

<h2 id="message">Welcome to Smart BikeRack</h2>
<div id="info" class="muted"></div>

<div id="slotActions" class="hidden">
  <button id="registerBtn">Register</button>
  <button id="loginUserBtn">Login</button>
  <button id="releaseBtn">Release Slot</button>
</div>

<script>
/* ========= CONFIG ========= */
const SUPABASE_URL = "https://lguyiavotyrxdlyhsvmz.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxndXlpYXZvdHlyeDRseWhzdm16Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkxNzQ0MjQsImV4cCI6MjA4NDc1MDQyNH0.f1hT0B68mv2lxVsQldk3ABx_0yBBUK2t1fcRHWGhmyM";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ========= ELEMENTS ========= */
const messageEl = document.getElementById("message");
const infoEl = document.getElementById("info");
const slotActions = document.getElementById("slotActions");
const releaseBtn = document.getElementById("releaseBtn");

let heartbeat = null;
let sessionId = null;
let sessionKey = null;

const now = () => Math.floor(Date.now()/1000);
const showError = (m)=>{messageEl.textContent=m;messageEl.className="error";};
const stopHeartbeat = ()=>{ if(heartbeat) clearInterval(heartbeat); };

window.addEventListener("load", async ()=>{

  const params = new URLSearchParams(location.search);
  const device = params.get("device");
  const slot = parseInt(params.get("slot"),10);

  if(!device || Number.isNaN(slot)){
    showError("Invalid QR.");
    return;
  }

  infoEl.textContent = `Device: ${device} | Slot: ${slot}`;

  /* ========= STEP 1: PHYSICAL OCCUPIED ========= */
  const { data: rack } = await client
    .from("rack_sessions")
    .select("status")
    .eq("device_uuid", device)
    .eq("slot", slot)
    .eq("status", 1)
    .limit(1);

  if(rack && rack.length){
    showError("Slot is occupied.");
    return;
  }

  /* ========= STEP 2: ACTIVE SESSION CHECK ========= */
  sessionKey = `session_${device}_${slot}`;
  sessionId = localStorage.getItem(sessionKey);

  // We look for the MOST RECENT session for this slot
  const { data: active } = await client
    .from("sessions")
    .select("session_id,last_seen")
    .eq("device_uuid", device)
    .eq("slot", slot)
    .order('last_seen', { ascending: false })
    .limit(1);

  // If the latest row exists AND it was seen within the last 60s
  if(active && active.length && (now() - active[0].last_seen < 60)){
    // If it's not our current browser session, block it
    if(active[0].session_id !== sessionId){
      showError("Slot is in use.");
      return;
    }
  }
  else{
    /* ========= STEP 3: CREATE NEW SESSION (LOGGING) ========= */
    // No delete here. We just add a new row. 
    // Since 'id' is our primary key, this will always succeed.
    sessionId = crypto.randomUUID();

    const { error } = await client.from("sessions").insert([{
      device_uuid: device,
      slot,
      session_id: sessionId,
      last_seen: now()
    }]);

    if(error){
      console.error(error);
      showError("Slot is in use.");
      return;
    }

    localStorage.setItem(sessionKey, sessionId);
  }

  /* ========= ALLOW ========= */
  messageEl.textContent = `Rack Ready - Slot ${slot}`;
  messageEl.className = "";
  slotActions.classList.remove("hidden");

  /* ========= HEARTBEAT ========= */
  heartbeat = setInterval(()=>{
    client.from("sessions")
      .update({ last_seen: now() })
      .eq("session_id", sessionId);
  },15000);

});

/* ========= RELEASE ========= */
releaseBtn.onclick = async ()=>{
  stopHeartbeat();

  await client
    .from("sessions")
    .delete()
    .eq("session_id", sessionId);

  localStorage.removeItem(sessionKey);

  messageEl.textContent="Slot Released ✔";
  slotActions.classList.add("hidden");
};

/* ========= CLEANUP ========= */
document.addEventListener("visibilitychange", ()=>{
  if(document.hidden) stopHeartbeat();
});
</script>

</body>
</html>
