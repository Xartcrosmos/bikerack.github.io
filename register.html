<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BikeRack Registration</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 60px; }
    input { padding: 8px; margin: 6px; font-size: 15px; width: 220px; }
    button { padding: 10px 20px; margin-top: 10px; cursor: pointer; }
    .hidden { display:none; }
    .msg { margin-top:15px; font-weight:bold; }
    .error { color:red; }
    .success { color:green; }
    .muted { color:#777; }
  </style>
</head>
<body>

  <h2 id="title">Preparing registration...</h2>
  <div id="formBox" class="hidden">
    <input id="nameInput" placeholder="Your Name" />
    <br/>
    <input id="contactInput" placeholder="Contact Number" />
    <br/>
    <button id="submitBtn">Submit & Scan Fingerprint</button>
  </div>
  <div id="statusMsg" class="msg muted"></div>

  <script>
    const SUPABASE_URL = "https://lguyiavotyrxdlyhsvmz.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxndXlpYXZvdHlyeGRseWhzdm16Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkxNzQ0MjQsImV4cCI6MjA4NDc1MDQyNH0.f1hT0B68mv2lxVsQldk3ABx_0yBBUK2t1fcRHWGhmyM";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const titleEl = document.getElementById("title");
    const formBox = document.getElementById("formBox");
    const statusMsg = document.getElementById("statusMsg");
    const submitBtn = document.getElementById("submitBtn");
    const cInput = document.getElementById("contactInput");
    const nInput = document.getElementById("nameInput");

    let pollTimer = null, heartbeat = null, sessionId = null, currentDevice = null, currentSlot = null;

    const now = () => Math.floor(Date.now() / 1000);
    const stopHeartbeat = ()=>{ if(heartbeat) clearInterval(heartbeat); };

    const runHeartbeat = async () => {
      if(!sessionId) return;
      await client.from("sessions").update({ last_seen: now() }).eq("session_id", sessionId);
    };
    const startHeartbeat = () => { stopHeartbeat(); runHeartbeat(); heartbeat = setInterval(runHeartbeat, 15000); };

    window.onload = async () => {
      const params = new URLSearchParams(window.location.search);
      currentDevice = params.get("device");
      currentSlot = parseInt(params.get("slot"));
      sessionId = localStorage.getItem(`session_${currentDevice}_${currentSlot}`);

      if (!currentDevice || !currentSlot || !sessionId) {
        window.location.href = "index.html";
        return;
      }
      
      await client.from("registration").delete().eq("device_uuid", currentDevice).eq("slot", currentSlot).eq("status", 0);

      titleEl.textContent = `Registering for Slot ${currentSlot}`;
      formBox.classList.remove("hidden");
      startHeartbeat();

      submitBtn.onclick = async () => {
        const name = nameInput.value.trim();
        const contact = contactInput.value.trim();
        if (!name || !contact) return;
        nInput.readOnly = true;
        submitBtn.disabled = true;
        statusMsg.className = "msg muted";
        statusMsg.textContent = "Processing...";
    
        // 1. GET THE ADMIN ID OF THIS RACK
        const { data: unit } = await client .from("device_unit") .select("admin_id") .eq("uuid", currentDevice) .maybeSingle();
          if (!unit || !unit.admin_id) {
          submitBtn.disabled = false;
          return statusMsg.textContent = "Error: Rack owner not found.";}
          statusMsg.textContent = "Waiting for fingerprint...";
    
        // 2. INSERT WITH ADMIN_ID
        const { data, error } = await client.from("registration").insert([{device_uuid: currentDevice,slot: currentSlot,name: name,contact: contact, admin_id: unit.admin_id,status: 0}]).select().single();
          if(error) {
            submitBtn.disabled = false;
            statusMsg.textContent = "Error: " + error.message;
            return; }

          pollStatus(data.id); 
      };
    };

    async function pollStatus(id) {
      // 1. ADD "id" TO THE SELECT
      const { data } = await client.from("registration").select("id, status").eq("id", id).single();
    
      if (!data) return;
    
      switch (data.status) {
        case 0: statusMsg.textContent = "Waiting for fingerprint..."; break;
        case 1: statusMsg.textContent = "Scan fingerprint again..."; break;
        case 2:
          statusMsg.className = "msg error";
          alert("Fingerprint already existed, error was found. Please try again.");
          await client.from("registration").update({ status: 0 }).eq("id", id); 
          break;
          
        case 3: 
          statusMsg.className = "msg success";
          statusMsg.textContent = "Registration successful! Redirecting...";
          clearTimeout(pollTimer);
          setTimeout(() => {
            window.location.href = `index.html?device=${currentDevice}&slot=${currentSlot}`;
          }, 1500);
          return;
        case 4: clearTimeout(pollTimer); return;
      }
      pollTimer = setTimeout(() => pollStatus(id), 2000);
    }

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) stopHeartbeat();
      else if (sessionId) startHeartbeat(); 
    });
  </script>
</body>
</html>
