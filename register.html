<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BikeRack Registration</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 60px; }
    input { padding: 8px; margin: 6px; font-size: 15px; width: 220px; }
    button { padding: 10px 20px; margin-top: 10px; cursor: pointer; }
    .hidden { display:none; }
    .msg { margin-top:15px; font-weight:bold; }
    .error { color:red; }
    .success { color:green; }
    .muted { color:#777; }
  </style>
</head>
<body>

  <h2 id="title">Preparing registration...</h2>
  <div id="formBox" class="hidden">
    <input id="nameInput" placeholder="Your Name" />
    <br/>
    <input id="contactInput" placeholder="Contact Number" />
    <br/>
    <button id="submitBtn">Submit & Scan Fingerprint</button>
  </div>
  <div id="statusMsg" class="msg muted"></div>

  <script>
    const SUPABASE_URL = "https://lguyiavotyrxdlyhsvmz.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxndXlpYXZvdHlyeGRseWhzdm16Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkxNzQ0MjQsImV4cCI6MjA4NDc1MDQyNH0.f1hT0B68mv2lxVsQldk3ABx_0yBBUK2t1fcRHWGhmyM";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const titleEl = document.getElementById("title");
    const formBox = document.getElementById("formBox");
    const statusMsg = document.getElementById("statusMsg");
    const submitBtn = document.getElementById("submitBtn");

    let pollTimer = null, heartbeat = null, sessionId = null, currentDevice = null, currentSlot = null, currentName = null, currentContact = null;

    const now = () => Math.floor(Date.now() / 1000);
    const stopHeartbeat = ()=>{ if(heartbeat) clearInterval(heartbeat); };

    /* ========= HEARTBEAT LOGIC (FIXED: Uses UPDATE) ========= */
    const runHeartbeat = async () => {
      if(!sessionId) return;
      await client.from("sessions").update({ last_seen: now() }).eq("session_id", sessionId);
    };
    const startHeartbeat = () => { stopHeartbeat(); runHeartbeat(); heartbeat = setInterval(runHeartbeat, 15000); };

    window.onload = async () => {
      const params = new URLSearchParams(window.location.search);
      currentDevice = params.get("device");
      currentSlot = parseInt(params.get("slot"));
      sessionId = localStorage.getItem(`session_${currentDevice}_${currentSlot}`);

      if (!currentDevice || !currentSlot || !sessionId) {
        window.location.href = "index.html";
        return;
      }
      
      /* Cleanup old pending rows in table */
      await client.from("registration").delete().eq("device_uuid", currentDevice).eq("slot", currentSlot).eq("status", 0);

      titleEl.textContent = `Registering for Slot ${currentSlot}`;
      formBox.classList.remove("hidden");
      startHeartbeat(); // Use the corrected heartbeat

      submitBtn.onclick = async () => {
        currentName = document.getElementById("nameInput").value.trim();
        currentContact = document.getElementById("contactInput").value.trim();
        if (!currentName || !currentContact) return;
        submitBtn.disabled = true;
        statusMsg.className = "msg muted";
        statusMsg.textContent = "Waiting for fingerprint...";

        // Insert request into the table (hardware reads this)
        await client.from("registration").insert([{
          device_uuid: currentDevice,
          slot: currentSlot,
          name: currentName,
          contact: currentContact,
          status: 0
        }]);

        pollStatus(); // Start polling 
      };
    };

    /* ==================================
       6️⃣ Poll hardware status
    ================================== */
    async function pollStatus() {
      const { data } = await client.from("registration").select("*")
        .eq("device_uuid", currentDevice).eq("slot", currentSlot)
        .order("created_at", { ascending: false }).limit(1).maybeSingle();

      if (!data) { pollTimer = setTimeout(() => pollStatus(), 2000); return; }

      switch (data.status) {
        case 0: statusMsg.textContent = "Waiting for fingerprint..."; break;
        case 1: statusMsg.textContent = "Scan fingerprint again..."; break;
        case 2:
          statusMsg.className = "msg error";
          alert("Fingerprint already existed, error was found. Please try again.");
          await client.from("registration").update({ status: 0 }).eq("id", data.id);
          statusMsg.textContent = "Waiting for fingerprint...";
          break;
        case 3: // Success is status 3
          statusMsg.className = "msg success";
          statusMsg.textContent = "Registration successful! Redirecting...";
          clearTimeout(pollTimer);

          // Insert final data into the actual REGISTRATION table now
          const { error: regError } = await client.from("registration").insert([{
              name: currentName,
              contact: currentContact,
              fingerid: data.fingerid, // Assuming hardware returns the fingerid here
              claimed_uuid: currentDevice // Link user to the device they claimed
          }]);

          if (regError) {
              console.error("Final registration insert failed:", regError);
              alert("Final registration failed. Please contact admin.");
          } else {
              setTimeout(() => {
                window.location.href = `index.html?device=${currentDevice}&slot=${currentSlot}`;
              }, 1500);
          }
          return;
        case 4: clearTimeout(pollTimer); return;
      }
      pollTimer = setTimeout(() => pollStatus(), 2000);
    }

    /* Add resume logic for heartbeat */
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) stopHeartbeat();
      else if (sessionId) startHeartbeat(); 
    });
  </script>
</body>
</html>
